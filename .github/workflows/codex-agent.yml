name: Codex Agent

on:
  issues:
    types:
      - labeled

jobs:
  codex:
    if: github.event.label.name == 'ai-agent'

    runs-on:
      - self-hosted
      - Windows

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Create branch
        shell: powershell
        run: |
          git switch -c feature/issue-${{ github.event.issue.number }}

      - name: Run Codex
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $prompt = @"
          GitHub Issue #$env:ISSUE_NUMBER を実装してください。

          タイトル:
          $env:ISSUE_TITLE

          内容:
          $env:ISSUE_BODY

          要求:
          - リポジトリを調査する
          - Issueの要求を実装する
          - 必要に応じてテストを追加・修正する
          - pytestを実行する
          - 問題があれば修正する

          Git操作は行わず、コード変更とテストまで実施してください。
          "@

          codex exec --sandbox workspace-write $prompt

      - name: Run tests
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -v tests

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "codex-agent"
          git config user.email "codex-agent@users.noreply.github.com"

          git add .
          git commit -m "Implement issue #${{ github.event.issue.number }}"
          git push origin feature/issue-${{ github.event.issue.number }}

      - name: Create PR
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create `
            --base development `
            --head feature/issue-${{ github.event.issue.number }} `
            --title "Implement #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" `
            --body "Closes #${{ github.event.issue.number }}"